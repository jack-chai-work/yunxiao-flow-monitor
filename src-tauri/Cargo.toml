[package]
name = "yunxiao-flow-monitor"
version = "0.1.0"
description = "云效流水线实时监控桌面工具（Tauri v2 + Vue 3）"
authors = ["yunxiao-flow-monitor"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "yunxiao_flow_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
# 开机自启：Windows 写当前用户的 Run 注册表项，macOS 用 LaunchAgent，Linux 用 XDG autostart
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "charset",
  "http2",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
futures = "0.3"
thiserror = "2"
percent-encoding = "2"
base64 = "0.22"
# 可选：把令牌存进系统钥匙串（Windows 凭据管理器 / macOS Keychain / Linux Secret Service）
# Linux 下需要 libdbus-1-dev，默认不开启，避免编译失败
keyring = { version = "3", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
secure-store = ["dep:keyring"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
